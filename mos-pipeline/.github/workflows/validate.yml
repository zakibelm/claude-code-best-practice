name: Validate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate-json:
    name: Validate JSON files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate n8n workflow JSON files
        run: |
          find n8n/ -name "*.json" | while read f; do
            echo "Checking $f"
            jq empty "$f" || exit 1
          done

      - name: Validate ComfyUI workflow JSON files
        run: |
          find comfyui/ -name "*.json" | while read f; do
            echo "Checking $f"
            jq empty "$f" || exit 1
          done

  scan-secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
